{% extends "base.html" %}

{% block titulo %}Nuevo pedido{% endblock %}

{% block contenido %}
<h1>Nuevo pedido — mesero #{{ mesero_id }}</h1>

<form method="post" action="{{ url_for('mesero.crear_pedido', mesero_id=mesero_id) }}">
    <label for="mesa_id">Mesa</label>
    <select name="mesa_id" id="mesa_id" required>
        {% for mesa in mesas %}
        <option value="{{ mesa.id }}">{{ mesa.nombre }}</option>
        {% endfor %}
    </select>

    <fieldset>
        <legend>Platos</legend>
        {% if not platos %}
        <p>No hay platos disponibles en este momento.</p>
        {% endif %}
        {% for plato in platos %}
        <label class="opcion-plato">
            <input type="number" name="cantidad_{{ plato.id }}" class="cantidad-plato" min="0" max="20" value="0">
            {{ plato.nombre }} — ${{ "{:,}".format(plato.precio) }}
        </label>
        {% endfor %}
    </fieldset>

    <button type="submit">Crear pedido</button>
</form>
{% endblock %}
